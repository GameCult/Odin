[package]
name = "odin-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "odin_daemon"
path = "src/lib.rs"

[dependencies]
signal-hook = "0.3"
anyhow = "1"
chrono = "0.4"
cultcache-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "3bf1c0cea53e0092187fa2e59a75ba1571947ffe", package = "cultcache-rs" }
cultmesh-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "3bf1c0cea53e0092187fa2e59a75ba1571947ffe", package = "cultmesh-rs" }
cultnet-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "3bf1c0cea53e0092187fa2e59a75ba1571947ffe", package = "cultnet-rs" }
fs2 = "0.4"
rmp-serde = "1.3"
serde = "1"

[dev-dependencies]
tempfile = "3"
