[package]
name = "odin-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "odin_daemon"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
cultcache-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "cbde940df2f5ee0ccac50e8dbfe9f36ffbebb585", package = "cultcache-rs" }
cultmesh-rs = { path = "../../vendor/cultmesh-rs" }
cultnet-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "cbde940df2f5ee0ccac50e8dbfe9f36ffbebb585", package = "cultnet-rs" }
fs2 = "0.4"
rmp-serde = "1.3"
serde = "1"

[dev-dependencies]
tempfile = "3"
