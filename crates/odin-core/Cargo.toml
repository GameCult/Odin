[package]
name = "odin-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "odin_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
cultcache-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "ae0ac0d3c92ccaee1a7eee2bbe033740c9ea2e55", package = "cultcache-rs" }
cultmesh-rs = { path = "../../vendor/cultmesh-rs" }
serde_json = "1"
cultnet-rs = { git = "https://github.com/GameCult/CultLib.git", rev = "ae0ac0d3c92ccaee1a7eee2bbe033740c9ea2e55", package = "cultnet-rs" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
rmp-serde = "1.3"
pretty_assertions = "1.4"
tempfile = "3"
